[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaos-agents"
version = "0.1.0"
description = "Chaos engineering for AI agents — Chaos Monkey, but for your agents and tools."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Shreyas Kapale", email = "shreyas@lyzr.ai" }]
keywords = [
    "chaos-engineering",
    "ai-agents",
    "llm",
    "testing",
    "resilience",
    "fault-injection",
    "chaos-monkey",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lyzr-ai/chaos-agents"
Source = "https://github.com/lyzr-ai/chaos-agents"
Issues = "https://github.com/lyzr-ai/chaos-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_agents"]
